[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
# At least as strict as Home Assistant's own strictly typed integrations (its mypy.ini).
# CI checks against the newest Home Assistant tested (requirements_test.txt).
files = ["custom_components/satellite_spotter"]
strict = true
local_partial_types = true
strict_bytes = true
warn_unreachable = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]

[[tool.mypy.overrides]]
# Home Assistant's integrations re-export what they import, as its mypy.ini lets them:
# homeassistant.components.http.StaticPathConfig, say.
module = ["homeassistant.components.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# Since Home Assistant 2026.9, `import voluptuous` gets probatio's stand-in, whose types
# are not voluptuous's: left untyped rather than checked against the wrong ones.
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# No type hints.
module = ["sgp4", "sgp4.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "D"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "D203", "D213", "PLR0911", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "S101"]
"scripts/*" = ["D", "T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

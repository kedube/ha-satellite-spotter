blueprint:
  name: Satellite pass notification
  description: >-
    Sends a phone notification shortly before a satellite pass in the
    Satellite Spotter calendar: what is passing, when and where to look, how
    bright it is, how good a pass it is, the forecast cloud cover and a picture
    of its path across the sky. Tapping the notification opens
    the pass in the street view on the Satellite Spotter page, which is there
    while a location has "Show Satellite Spotter in the sidebar" on (the
    default); with it off for every location, the tap opens your default
    dashboard instead. Requires the Satellite Spotter integration with its
    calendar switched on (the default).
  domain: automation
  source_url: https://github.com/kedube/ha-satellite-spotter/blob/main/blueprints/automation/satellite_spotter/notify_satellite_pass.yaml
  input:
    calendar:
      name: Calendar of passes
      description: The "Visible passes" calendar of the location you watch from.
      selector:
        entity:
          filter:
            - integration: satellite_spotter
              domain: calendar
    notice:
      name: Advance notice
      description: How long before the pass begins to send the notification.
      default: "-0:10:00"
      selector:
        select:
          options:
            - label: 5 minutes
              value: "-0:05:00"
            - label: 10 minutes
              value: "-0:10:00"
            - label: 15 minutes
              value: "-0:15:00"
            - label: 20 minutes
              value: "-0:20:00"
            - label: 30 minutes
              value: "-0:30:00"
            - label: 45 minutes
              value: "-0:45:00"
            - label: 1 hour
              value: "-1:00:00"
            - label: 2 hours
              value: "-2:00:00"
    min_rating:
      name: Minimum rating
      description: >-
        Only passes rated at least this. The rating weighs how bright the pass
        looks against the sky at that moment, how high it climbs, how long it
        lasts, the Moon and the forecast clouds.
      default: good
      selector:
        select:
          options:
            - label: Great
              value: great
            - label: Good
              value: good
            - label: Fair
              value: fair
            - label: Any pass
              value: poor
    bright_only:
      name: Bright passes only
      description: >-
        Also require a bright pass: brighter than magnitude 0.5 against a
        properly dark sky, easy to see even from a town.
      default: false
      selector:
        boolean:
    kinds:
      name: Only these kinds of satellite
      description: Leave empty for every kind.
      default: []
      selector:
        select:
          multiple: true
          options:
            - label: International Space Station
              value: iss
            - label: Tiangong
              value: tiangong
            - label: Hubble
              value: hubble
            - label: Starlink trains
              value: starlink
            - label: Rocket stages
              value: rocket
            - label: Debris
              value: debris
            - label: Other satellites
              value: satellite
    satellite_name:
      name: Only satellites named
      description: >-
        Only passes with a satellite whose name contains this, such as SAOCOM.
        Leave empty for any name.
      default: ""
      selector:
        text:
    max_cloud_cover:
      name: Maximum cloud cover
      description: >-
        Skip passes with more forecast cloud cover than this. Passes without a
        forecast (the integration's Cloud forecast option is off, or Open-Meteo
        did not answer) are always announced.
      default: 60
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider
    quiet_from:
      name: Quiet hours from
      description: >-
        No notifications from this time until the next. The same time in both
        means no quiet hours.
      default: "00:00:00"
      selector:
        time:
    quiet_until:
      name: Quiet hours until
      default: "00:00:00"
      selector:
        time:
    sky_chart:
      name: Sky chart
      description: >-
        Attach a picture of the pass's path across the sky. The phone must be
        able to reach your Home Assistant to load it.
      default: true
      selector:
        boolean:
    notify_device:
      name: Phone to notify
      description: A device running the Home Assistant Companion app.
      selector:
        device:
          filter:
            - integration: mobile_app

# Passes can follow each other within minutes; each gets its notification.
mode: queued
max: 10

triggers:
  - trigger: calendar
    event: start
    offset: !input notice
    entity_id: !input calendar

# The calendar supplies the message in Home Assistant's language. Its final
# line is an object link, which belongs in the calendar rather than a phone
# notification. The cloud percentage and bright mark are used for filtering.
variables:
  bright_only: !input bright_only
  max_cloud_cover: !input max_cloud_cover
  quiet_from: !input quiet_from
  quiet_until: !input quiet_until
  sky_chart: !input sky_chart
  calendar: !input calendar
  summary: "{{ trigger.calendar_event.summary | default('', true) }}"
  description: "{{ trigger.calendar_event.description | default('', true) }}"
  pass_id: "{{ trigger.calendar_event.uid | default('', true) }}"
  # The location the calendar belongs to, so the link opens the pass there
  # when Satellite Spotter has several.
  entry_id: "{{ config_entry_id(calendar) or '' }}"
  bright: "{{ summary.startswith('🌟') }}"
  satellite: >-
    {{ summary | regex_replace('^\\W+', '') | trim }}
  minutes: >-
    {{ ((as_timestamp(trigger.calendar_event.start) - as_timestamp(now())) / 60) | round(0) | int }}
  cloud_cover: >-
    {% set found = description | regex_findall('(\\d+)\\s?%') %}
    {{ found[0] | int if found else none }}
  details: >-
    {{ description.split('\n')[:-1] | join(' ') }}
  link: >-
    /satellite-spotter?{{ ('entry_id=' ~ entry_id ~ '&') if entry_id else '' }}pass={{ pass_id }}&view=street
  # Across midnight when it starts later than it ends.
  quiet: >-
    {% set time = now().strftime('%H:%M:%S') %}
    {% if quiet_from == quiet_until %}
      {{ false }}
    {% elif quiet_from < quiet_until %}
      {{ quiet_from <= time < quiet_until }}
    {% else %}
      {{ time >= quiet_from or time < quiet_until }}
    {% endif %}

conditions:
  - condition: template
    value_template: "{{ bright or not bright_only }}"
  - condition: template
    value_template: "{{ cloud_cover is none or cloud_cover <= max_cloud_cover | int }}"
  - condition: template
    value_template: "{{ not quiet }}"

actions:
  # Lists this pass only if it is what was asked for, whatever the language.
  - action: satellite_spotter.get_passes
    data:
      config_entry_id: "{{ entry_id }}"
      pass_id: "{{ pass_id }}"
      min_rating: !input min_rating
      kinds: !input kinds
      satellite: !input satellite_name
    response_variable: found
  - condition: template
    value_template: "{{ found.passes | count > 0 }}"
  - variables:
      # Opens the pass in the street view: url on iOS, clickAction on Android.
      opens_the_pass: >-
        {{ dict(url=link, clickAction=link, tag='satellite-pass-' ~ pass_id) }}
      notification_data: >-
        {{ dict(opens_the_pass, image=found.passes[0].sky_chart) if sky_chart else opens_the_pass }}
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "{{ satellite }} in {{ minutes }} min"
    message: "{{ details }}"
    data: "{{ notification_data }}"

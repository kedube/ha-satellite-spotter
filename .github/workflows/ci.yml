name: CI

# Every push to main and every pull request: lint, strict typing, the Python
# tests on the oldest supported and the newest tested Home Assistant, the
# frontend tests, hassfest, and what merging would release. On main, a pass
# is what lets the Release workflow publish a new version (release.yml). On
# Mondays it also tries the newest Home Assistant there is, without holding
# anything up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # A newer push to a pull request makes its older runs moot.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Pinned, so a new ruff release cannot fail CI on code that has not changed.
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  typing:
    name: Typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      # Against the newest Home Assistant tested; the settings are in pyproject.toml.
      - run: pip install -r requirements_test.txt
      # Pinned, like ruff, so a new mypy release cannot fail CI on code that has not changed.
      - run: pip install mypy==2.4.0
      - run: mypy

  version:
    name: Release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Whether this commit releases the manifest's version once it is on main.
      # Fails on a version that is not MAJOR.MM, or lower than the latest release.
      - run: python scripts/release.py status | tee -a "$GITHUB_STEP_SUMMARY"

  python:
    name: Python, Home Assistant ${{ matrix.home-assistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest version hacs.json allows, and the newest one tested.
          - home-assistant: "2026.2"
            python: "3.13"
            requirements: requirements_test_oldest.txt
          - home-assistant: "2026.10"
            python: "3.14"
            requirements: requirements_test.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: pip install -r ${{ matrix.requirements }}
      - run: pytest

  newest:
    name: Python, newest Home Assistant
    # Mondays, and by hand: early warning of a Home Assistant change, never a
    # reason to hold up a release (so not when the Release workflow runs CI).
    if: github.workflow == 'CI' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pip install --upgrade pytest-homeassistant-custom-component home-assistant-frontend
      - run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Quoted, so Node expands the glob itself.
      - run: node --test "tests/js/*.test.mjs"
      - name: The modules parse
        run: |
          find custom_components/satellite_spotter/frontend \
            -path '*/vendor' -prune -o -name '*.js' -print0 |
            xargs -0 -n 1 node --check

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

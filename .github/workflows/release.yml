name: Release

# Publishes the version in manifest.json once CI has passed on main. Raise
# "version" there (python scripts/release.py bump) and push or merge it: when
# CI passes on a commit whose version is not released yet, this tags that
# commit with the version and publishes a GitHub release, with the notes from
# CHANGELOG.md (or else the commits since the last release) and
# satellite_spotter.zip, which HACS installs. Every other push releases
# nothing. If a release fails, the next push that passes CI tries again; run
# this workflow by hand to try at once (it runs CI on main's head first).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release decision at a time, so two quick pushes cannot both publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    # CI passed for a push to main (not a pull request or the Monday run), or a run by hand.
    if: >-
      github.repository == 'kedube/ha-satellite-spotter' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested; run by hand, the head of main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          { gh release list --limit 1000 --json tagName --jq '.[].tagName'
            git ls-remote --tags --refs origin | sed 's|.*refs/tags/||'
          } | python3 scripts/release.py plan >> "$GITHUB_OUTPUT"

  # Run by hand, the commit has not come through CI: test it first.
  ci:
    name: CI
    needs: plan
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ needs.plan.outputs.version }}
    needs: [plan, ci]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREVIOUS: ${{ needs.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # The history, for the commits since the last release.
          fetch-depth: 0
      - name: Package
        run: python3 scripts/release.py package dist/satellite_spotter.zip
      - name: Notes
        run: python3 scripts/release.py notes "$VERSION" "$PREVIOUS" | tee dist/notes.md
      - name: Publish
        run: >-
          gh release create "$VERSION" dist/satellite_spotter.zip
          --target "$SHA" --title "$VERSION" --notes-file dist/notes.md

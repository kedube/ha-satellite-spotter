# Proposes updates to the actions the workflows use and to the tests' tools. requirements_test_oldest.txt
# stays as it is: its point is the oldest Home Assistant supported. MapLibre is bundled, so it is updated
# by hand: see docs/updating-maplibre.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    exclude-paths:
      - requirements_test_oldest.txt
    schedule:
      interval: weekly

get_passes:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: satellite_spotter
    pass_id:
      selector:
        text:
    start:
      selector:
        datetime:
    end:
      selector:
        datetime:
    min_rating:
      selector:
        select:
          translation_key: rating
          mode: dropdown
          options:
            - great
            - good
            - fair
            - poor
    max_cloud_cover:
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider
    bright_only:
      selector:
        boolean:
    kinds:
      selector:
        select:
          translation_key: kind
          multiple: true
          mode: dropdown
          options:
            - iss
            - tiangong
            - hubble
            - starlink
            - rocket
            - debris
            - satellite
    satellite:
      selector:
        text:
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 200
          mode: box
